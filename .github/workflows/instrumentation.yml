name: Instrumentation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Android instrumentation tests
    runs-on: ubuntu-24.04
    outputs:
      has_tests: ${{ steps.check.outputs.has_tests }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: check
        name: Check Android module and test sources
        shell: bash
        run: |
          if [[ ! -f app/build.gradle.kts && ! -f app/build.gradle ]]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if find . -type d \( -name .git -o -name build -o -name .gradle \) -prune -o \
              -type f -path '*/src/androidTest/*' \( -name '*.kt' -o -name '*.java' \) -print -quit | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

  instrumented-tests:
    name: Run Android instrumentation suite
    needs: detect
    if: ${{ needs.detect.outputs.has_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run instrumentation tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: instrumentation-test-reports
          path: |
            **/build/outputs/androidTest-results/connected/**/*.xml
            **/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 14

  skipped:
    name: Explain why instrumentation tests were skipped
    needs: detect
    if: ${{ needs.detect.outputs.has_tests != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Report missing instrumentation suite
        run: echo "::notice::Instrumentation tests were skipped because no Android app module with src/androidTest Kotlin/Java test sources exists yet."
