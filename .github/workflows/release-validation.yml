name: Release Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate unsigned release build
        run: gradle testDebugUnitTest lintDebug assembleRelease --stacktrace
      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astracode-release-validation
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 7
